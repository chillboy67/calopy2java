stages:
  - versioning

update_version_file:
  stage: versioning
  image: curlimages/curl:latest
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v/'
      when: always
    - when: never

  script:
    - 'echo "Creating VERSION file for tag: $CI_COMMIT_TAG"'
    - 'echo "{
        \"branch\": \"release\",
        \"commit_message\": \"Create VERSION file for tag $CI_COMMIT_TAG\",
        \"actions\": [
          {
            \"action\": \"create\",
            \"file_path\": \"VERSION\",
            \"content\": \"$CI_COMMIT_TAG\"
          }
        ]
      }" > payload.json'
    - 'curl --fail --request POST "https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/repository/commits" --header "PRIVATE-TOKEN: $CI_PUSH_TOKEN" --header "Content-Type: application/json" --data @payload.json || echo "Create failed, trying update..."'
    - 'echo "{
        \"branch\": \"release\",
        \"commit_message\": \"Update VERSION file for tag $CI_COMMIT_TAG\",
        \"actions\": [
          {
            \"action\": \"update\",
            \"file_path\": \"VERSION\",
            \"content\": \"$CI_COMMIT_TAG\"
          }
        ]
      }" > payload.json'
    - 'curl --fail --request POST "https://gitlab.com/api/v4/projects/$CI_PROJECT_ID/repository/commits" --header "PRIVATE-TOKEN: $CI_PUSH_TOKEN" --header "Content-Type: application/json" --data @payload.json'
